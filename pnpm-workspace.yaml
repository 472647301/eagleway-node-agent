packages:
  - .

overrides:
  # Swagger 11.4.7 still pins the vulnerable 5.3.0 parser.
  '@nestjs/swagger>js-yaml': '5.4.1'
  # Keep the release audit passing for the affected transitive versions.
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
  'multer@>=2.0.0 <2.5.0': '2.5.0'
  'qs@>=6.7.0 <=6.16.0': '6.16.1'

onlyBuiltDependencies:
  - better-sqlite3
allowBuilds:
  '@scarf/scarf': false
  better-sqlite3: true
  protobufjs: false
